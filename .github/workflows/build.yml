---
name: Build Mevya 44 ISO

on:
  workflow_dispatch:
    inputs:
      releasever:
        description: Mevya release number (Fedora base release) used for the ISO
        required: true
        type: choice
        default: "44"
        options:
          - "44"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compose Mevya ${{ inputs.releasever }} ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate and render Kickstart
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-project.sh
          scripts/render-kickstart.sh kickstarts/mevya-live.ks

      - name: Check build space
        shell: bash
        run: |
          set -euo pipefail
          available_kb="$(df -Pk "${GITHUB_WORKSPACE}" | awk 'NR == 2 { print $4 }')"
          available_gib=$((available_kb / 1024 / 1024))
          printf 'Available build space: %s GiB\n' "${available_gib}"
          if (( available_kb < 12 * 1024 * 1024 )); then
            printf '%s\n' 'Insufficient build space: at least 12 GiB is required.' >&2
            exit 1
          fi

      - name: Verify Podman
        run: |
          set -euo pipefail
          podman --version
          sudo podman info >/dev/null

      - name: Build ISO in Fedora
        env:
          RELEASEVER: ${{ inputs.releasever }}
        run: |
          set -euo pipefail
          sudo podman run --privileged --rm \
            --network=host \
            --security-opt label=disable \
            --env RELEASEVER="${RELEASEVER}" \
            --volume "${GITHUB_WORKSPACE}:/workspace:Z" \
            --workdir /workspace \
            quay.io/fedora/fedora:44 \
            bash -euo pipefail -c '
              dnf -y upgrade --refresh
              dnf -y install \
                dnf5 \
                dnf5-plugins \
                lorax-lmc-novirt \
                lorax-templates-generic \
                pykickstart \
                policycoreutils \
                util-linux \
                which

              ksvalidator kickstarts/mevya-live.ks
              BUILD=1 RELEASEVER="${RELEASEVER}" \
                scripts/build-iso.sh
            '

      - name: Fix ISO artifact permissions
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" release

      - name: Generate ISO checksum
        shell: bash
        run: |
          set -euo pipefail
          ISO_FILE="$(find release -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "${ISO_FILE}"
          sha256sum "${ISO_FILE}" > "${ISO_FILE}.sha256"
          printf 'Built ISO: %s\n' "${ISO_FILE}"
          du -h "${ISO_FILE}" "${ISO_FILE}.sha256"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: mevya-${{ inputs.releasever }}-iso-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
