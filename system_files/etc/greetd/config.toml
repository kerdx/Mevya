[terminal]
vt = 1

# The live image starts the desktop directly for the technical Mevya user.
# The first-boot cleanup removes this block from installed systems unless a
# future installer option explicitly enables autologin.
[initial_session]
user = "mevya"
command = "dbus-run-session -- /usr/bin/labwc"

[default_session]
user = "greeter"
command = "/usr/bin/dms-greeter --command labwc"
